<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각 — 리이오의 연습장</title>
<meta name="description" content="한 주제를 오래 붙들고 적어 둔 고찰들. 일, 학습과 성장, 만든 것, 접근성.">
<meta property="og:title" content="생각 — 리이오의 연습장">
<meta property="og:description" content="한 주제를 오래 붙들고 적어 둔 고찰들.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://m1zz.github.io/LeeoNote/thoughts.html">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/notebook.css">

<script async src="js/analytics.js"></script>
<style>
  /* ── 생각 목록 (data/notes.json 에서 렌더) ───────────── */
  .nt-cat { margin-top: 2.6rem; }
  .nt-cat:first-child { margin-top: 1.2rem; }
  .nt-cat-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding-bottom: 0.7rem;
    border-bottom: 2px solid var(--ink);
  }
  .nt-cat-icon { font-size: 1rem; }
  .nt-cat-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); }
  .nt-cat-count { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-mute); }
  .nt-cat-desc { font-size: 0.85rem; color: var(--ink-faint); margin: 0.55rem 0 0; }

  .nt-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.3rem 1rem;
    align-items: baseline;
    padding: 1.05rem 0.5rem 1.05rem 0.2rem;
    border-bottom: 1px solid var(--rule);
    border-radius: 4px;
    transition: background 0.16s, padding-left 0.16s;
  }
  .nt-row:hover { background: var(--paper-warm); padding-left: 0.6rem; border-bottom: 1px solid var(--rule); }
  .nt-title { font-size: 1rem; font-weight: 700; color: var(--ink); line-height: 1.5; }
  .nt-summary { grid-column: 1 / -1; font-size: 0.88rem; color: var(--ink-faint); line-height: 1.6; }
  .nt-meta {
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .nt-badge {
    border: 1px solid var(--paper-deep);
    border-radius: 100px;
    padding: 0.12rem 0.5rem;
    color: var(--ink-faint);
  }
  .nt-badge.is-thinking { border-style: dashed; border-color: var(--ink-mute); }
  .nt-ext { font-size: 0.72rem; color: var(--ink-mute); margin-left: 0.35rem; vertical-align: 0.08em; }
  .nt-src { color: var(--ink-faint); }

  /* 태그 */
  .nt-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  .nt-tag {
    font-family: var(--mono);
    font-size: 0.63rem;
    letter-spacing: 0.04em;
    color: var(--ink-mute);
    background: var(--paper-warm);
    border-radius: 100px;
    padding: 0.14rem 0.5rem;
  }
  .nt-tag.is-on { background: var(--ink); color: #fff; }

  /* 태그 필터 바 */
  .nt-filter { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.4rem; }
  .nt-filter[hidden] { display: none; }
  .nt-chip {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid var(--paper-deep);
    border-radius: 100px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
    transition: border-color 0.16s, color 0.16s, background 0.16s;
  }
  .nt-chip:hover { border-color: var(--ink); color: var(--ink); }
  .nt-chip span { color: var(--ink-mute); margin-left: 0.15rem; }
  .nt-chip.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .nt-chip.is-on span { color: rgba(255,255,255,0.6); }
  .nt-chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 600px) {
    .nt-row { grid-template-columns: 1fr; }
    .nt-meta { order: 3; }
  }

  /* 아직 올린 글이 없을 때 */
  .nt-empty {
    border: 1px dashed var(--ink-mute);
    border-radius: 8px;
    padding: 2.2rem 1.8rem;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.92rem;
    line-height: 1.75;
    margin-top: 1.4rem;
  }
  .nt-empty b { color: var(--ink); font-weight: 700; }

  /* ── 요즘 (최근 몇 편) ────────────────────────── */
  .nt-recent { margin-top: 0.2rem; }
  .nt-recent[hidden] { display: none; }
  .nt-recent-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem 1rem;
    flex-wrap: wrap;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--rule);
  }
  .nt-recent-label { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .nt-tally {
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
  }
  .nt-recent-row {
    display: grid;
    grid-template-columns: 4.4rem 1fr auto;
    gap: 0 0.9rem;
    align-items: baseline;
    padding: 0.72rem 0.4rem 0.72rem 0.2rem;
    border-bottom: 1px solid var(--rule);
    border-radius: 4px;
    transition: background 0.16s, padding-left 0.16s;
  }
  .nt-recent-row:hover { background: var(--paper-warm); padding-left: 0.5rem; border-bottom: 1px solid var(--rule); }
  .nt-recent-row:last-child { border-bottom: none; }
  .nt-recent-when { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-mute); }
  .nt-recent-title { font-size: 0.94rem; font-weight: 700; color: var(--ink); line-height: 1.5; }
  .nt-recent-where {
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  @media (max-width: 620px) {
    .nt-recent-row { grid-template-columns: 1fr auto; }
    .nt-recent-when { grid-column: 1 / -1; order: -1; margin-bottom: 0.15rem; }
  }

  /* ── 쌓아 둔 것 ───────────────────────────────── */
  .nt-arch { margin: 2.9rem 0 1.1rem; padding-top: 1.7rem; border-top: 1px solid var(--rule); }
  .nt-arch[hidden] { display: none; }
  .nt-arch-label { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .nt-arch-desc { font-size: 0.82rem; color: var(--ink-faint); margin: 0.4rem 0 0; line-height: 1.7; }

  /* 더 보기 */
  .nt-more {
    display: block;
    width: 100%;
    margin-top: 0.8rem;
    padding: 0.65rem 0;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    background: transparent;
    border: 1px dashed var(--paper-deep);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.16s, color 0.16s;
  }
  .nt-more:hover { border-color: var(--ink-mute); color: var(--ink); }
  .nt-more:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>

      <a href="tools.html">도구</a>
      <a href="join.html">직접 만들기</a>
    </nav>
  </div>
</header>

<main>

  <section class="container page-head">
    <div class="page-eyebrow">Reflections</div>
    <h1 class="page-title">생각</h1>
    <p class="page-sub">
      연습장에 적어 두는 칸입니다. 한 주제를 오래 붙들고 남긴 <em>고찰</em>이라
      짧은 감상은 아니지만, 다 쓴 글도 아니에요.
      결론이 난 것도 있고 아직 아닌 것도 있어서, <em>생각이 바뀌면 글도 고칩니다.</em>
    </p>
  </section>

  <section class="container" id="notes">
    <div class="nt-recent" id="noteRecent" hidden></div>

    <div class="nt-arch" id="noteArch" hidden>
      <div class="nt-arch-label">쌓아 둔 것</div>
      <p class="nt-arch-desc">주제별로 모아 둡니다. 칸마다 최근 네 편만 펼쳐 두고 나머지는 접어 둡니다.</p>
    </div>

    <div class="nt-filter" id="noteFilter" hidden></div>
    <div id="noteList"></div>
  </section>

</main>

<footer class="container">
  <div class="footer-quote">— 적어둔 생각만이 다음 생각으로 이어진다.</div>
  <div class="footer-copy">© 2026 Leeo</div>
</footer>

<script>
// 생각 목록 — data/notes.json 을 읽어 그린다.
// 카테고리를 늘리려면 JSON 의 categories 에, 태그는 각 글의 tags 배열에 적으면 된다.
// 글 순서는 date 내림차순으로 자동 정렬되니 JSON 안에서 손으로 맞출 필요가 없다.
// 이 파일은 손대지 않아도 된다.
(function () {
  var box = document.getElementById('noteList');
  var bar = document.getElementById('noteFilter');
  var rec = document.getElementById('noteRecent');
  var arc = document.getElementById('noteArch');
  if (!box) return;

  var LIMIT  = 4;   // 카테고리마다 처음에 펼쳐 둘 편수 (나머지는 '더 보기')
  var RECENT = 3;   // 맨 위 '요즘'에 올릴 편수
  var MIN    = 4;   // 글이 이보다 적으면 '요즘'을 아예 띄우지 않는다 (목록과 겹쳐서)

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var empty = '<div class="nt-empty">아직 올려 둔 생각이 없습니다.<br><b>첫 편을 쓰는 중입니다.</b></div>';

  var notes = [], cats = [], active = null, open = {};   // active = 고른 태그, open = 펼쳐 둔 카테고리

  function tagsOf(n) { return Array.isArray(n.tags) ? n.tags : []; }
  function hrefOf(n) { return n.file || ('notes/' + n.id + '.html'); }
  function isExt(h)  { return /^https?:/.test(h); }      // 사이트 밖에 쓴 글은 새 탭으로

  // '2026.09' → '20260900' — 자리를 채워서 문자열로 비교한다
  function keyOf(n) {
    var d = String(n.date || '').replace(/[^0-9]/g, '');
    while (d.length < 8) d += '0';
    return d.slice(0, 8);
  }
  function catName(id) {
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i].name;
    return id;
  }

  function rowHTML(n) {
    var thinking = n.status !== 'settled';
    var href = hrefOf(n), ext = isExt(href), tags = tagsOf(n);
    return '<a class="nt-row" href="' + esc(href) + '"' +
             (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
             '<span class="nt-title">' + esc(n.title) +
               (ext ? '<span class="nt-ext">↗</span>' : '') +
             '</span>' +
             '<span class="nt-meta">' +
               '<span class="nt-badge' + (thinking ? ' is-thinking' : '') + '">' +
                 (thinking ? '생각 중' : '정리됨') +
               '</span>' +
               (n.source ? '<span class="nt-src">' + esc(n.source) + '</span>' : '') +
               esc(n.date || '') +
             '</span>' +
             (n.summary ? '<span class="nt-summary">' + esc(n.summary) + '</span>' : '') +
             (tags.length
               ? '<span class="nt-tags">' + tags.map(function (t) {
                   return '<span class="nt-tag' + (t === active ? ' is-on' : '') + '">#' + esc(t) + '</span>';
                 }).join('') + '</span>'
               : '') +
           '</a>';
  }

  // 맨 위 '요즘' — 최근 몇 편만. 태그를 고른 동안엔 감춘다 (최신과 상관없는 목록이 되니까)
  function renderRecent() {
    if (!rec) return;
    if (active || notes.length < MIN) { rec.hidden = true; return; }

    var thinking = 0;
    notes.forEach(function (n) { if (n.status !== 'settled') thinking++; });
    var since = notes[notes.length - 1].date || '';

    var html = '<div class="nt-recent-head">' +
                 '<span class="nt-recent-label">요즘</span>' +
                 '<span class="nt-tally">' + notes.length + '편 · 생각 중 ' + thinking +
                   (since ? ' · ' + esc(since) + '부터' : '') + '</span>' +
               '</div>';

    notes.slice(0, RECENT).forEach(function (n) {
      var href = hrefOf(n), ext = isExt(href);
      html += '<a class="nt-recent-row" href="' + esc(href) + '"' +
                (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
                '<span class="nt-recent-when">' + esc(n.date || '') + '</span>' +
                '<span class="nt-recent-title">' + esc(n.title) +
                  (ext ? '<span class="nt-ext">↗</span>' : '') + '</span>' +
                '<span class="nt-recent-where">' + esc(catName(n.category)) + '</span>' +
              '</a>';
    });

    rec.innerHTML = html;
    rec.hidden = false;
  }

  function renderList() {
    var shown = active
      ? notes.filter(function (n) { return tagsOf(n).indexOf(active) !== -1; })
      : notes;

    if (arc) arc.hidden = !notes.length;

    if (!shown.length) {
      box.innerHTML = '<div class="nt-empty">이 태그로 걸어 둔 글이 아직 없습니다.</div>';
      return;
    }

    var html = '';
    cats.forEach(function (cat) {
      var mine = shown.filter(function (n) { return n.category === cat.id; });
      if (!mine.length) return;          // 빈 카테고리는 그리지 않는다

      var isOpen = !!open[cat.id];
      var vis = isOpen ? mine : mine.slice(0, LIMIT);
      var rest = mine.length - vis.length;

      html += '<div class="nt-cat">';
      html += '<div class="nt-cat-head">' +
                '<span class="nt-cat-icon">' + esc(cat.icon || '·') + '</span>' +
                '<span class="nt-cat-name">' + esc(cat.name) + '</span>' +
                '<span class="nt-cat-count">' + mine.length + '</span>' +
              '</div>';
      if (cat.desc) html += '<p class="nt-cat-desc">' + esc(cat.desc) + '</p>';

      vis.forEach(function (n) { html += rowHTML(n); });

      if (rest > 0) {
        html += '<button type="button" class="nt-more" data-cat="' + esc(cat.id) + '">↓ ' + rest + '편 더 보기</button>';
      } else if (isOpen && mine.length > LIMIT) {
        html += '<button type="button" class="nt-more" data-cat="' + esc(cat.id) + '">↑ 접기</button>';
      }
      html += '</div>';
    });

    box.innerHTML = html || empty;
  }

  function renderBar() {
    if (!bar) return;
    var count = {};
    notes.forEach(function (n) {
      tagsOf(n).forEach(function (t) { count[t] = (count[t] || 0) + 1; });
    });
    var names = Object.keys(count).sort(function (a, b) {
      return count[b] - count[a] || a.localeCompare(b, 'ko');
    });
    if (!names.length) { bar.hidden = true; return; }   // 태그가 하나도 없으면 필터 자체를 감춘다

    var html = '<button type="button" class="nt-chip' + (active ? '' : ' is-on') +
               '" data-tag="">전체 <span>' + notes.length + '</span></button>';
    names.forEach(function (t) {
      html += '<button type="button" class="nt-chip' + (t === active ? ' is-on' : '') +
              '" data-tag="' + esc(t) + '">#' + esc(t) + ' <span>' + count[t] + '</span></button>';
    });
    bar.innerHTML = html;
    bar.hidden = false;
  }

  if (bar) {
    bar.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.nt-chip') : null;
      if (!btn) return;
      var t = btn.getAttribute('data-tag');
      active = t ? (active === t ? null : t) : null;   // 같은 태그를 다시 누르면 해제
      renderBar();
      renderRecent();
      renderList();
    });
  }

  box.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.nt-more') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-cat');
    open[id] = !open[id];
    renderList();
  });

  fetch('data/notes.json', { cache: 'no-cache' })
    .then(function (res) { if (!res.ok) throw new Error('no data'); return res.json(); })
    .then(function (data) {
      notes = (data && data.notes) || [];
      if (!notes.length) { box.innerHTML = empty; return; }

      cats = (data && data.categories) || [];
      var known = cats.map(function (c) { return c.id; });
      // JSON 에 등록 안 된 카테고리가 글에 있으면 뒤에 자동으로 붙인다
      notes.forEach(function (n) {
        if (n.category && known.indexOf(n.category) === -1) {
          known.push(n.category);
          cats.push({ id: n.category, name: n.category, icon: '·', desc: '' });
        }
      });

      // 최신이 위로. 카테고리 순서만 JSON 의 categories 순서를 따른다.
      notes.sort(function (a, b) { return keyOf(a) < keyOf(b) ? 1 : keyOf(a) > keyOf(b) ? -1 : 0; });

      renderRecent();
      renderBar();
      renderList();
    })
    .catch(function () { box.innerHTML = empty; });
})();
</script>

</body>
</html>
